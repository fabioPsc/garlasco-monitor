name: Monitor Garlasco

on:
  schedule:
    - cron: "0 */3 * * *"   # ogni 3 ore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-garlasco
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_garlasco.py
      - name: Salva stato e log
        run: |
          git config user.name "garlasco-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json novita.json novita.md || true
          git diff --cached --quiet || (git commit -m "Aggiornamento novità" && git pull --rebase && git push)